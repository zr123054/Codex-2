<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FE25 Test APP Web Prototype</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="prototype-shell">
    <section class="phone" aria-label="FE25 Test APP 手机交互原型">
      <div class="hardware-notch" aria-hidden="true"></div>
      <div class="status-bar" aria-hidden="true">
        <span>9:41</span>
        <span class="signal">▮▮▮ ᯤ ▰</span>
      </div>
      <div id="app" class="screen" aria-live="polite"></div>
    </section>

    <aside class="guide-panel">
      <p class="eyebrow">Interactive Web Prototype</p>
      <h1>FE25 Test APP 网页版</h1>
      <p>已按示意图实现启动、权限申请、主页设备列表、固件升级/回退、单设备采集、事件标记、数据导出与设置多级菜单。</p>
      <div class="flow-card">
        <h2>可点击路径</h2>
        <ul>
          <li>启动页 5 秒自动进入权限申请。</li>
          <li>权限申请 → 全部开启 / 暂不设置 → 首页。</li>
          <li>首页 → 扫描设备、连接/断开、升级、点击设备进入采集页。</li>
          <li>升级/回退、导出进度均为 5 秒动态进度条，完成后进入结果页。</li>
          <li>底部任务栏可进入首页、导出、设置；所有二级页支持返回。</li>
        </ul>
      </div>
      <div class="quick-actions">
        <button data-shortcut="splash">重看启动</button>
        <button data-shortcut="home">进入首页</button>
        <button data-shortcut="export">数据导出</button>
        <button data-shortcut="settings">设置</button>
      </div>
    </aside>
  </main>
  <script src="script.js"></script>
</body>
</html>
